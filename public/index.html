<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ramiro Cantú Personalizados</title>
<meta name="description" content="Entrenamientos personalizados en Mendoza: rutina y dieta a medida, y tu plan siempre en el celular.">
<meta name="theme-color" content="#121011">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ramiro Cantú">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: app de una columna, pensada para el celular en el gimnasio; encabezado fijo, pestañas, tarjetas por ejercicio */
:root{
  --bg:#f6f5f4; --surface:#ffffff; --ink:#141213; --muted:#6c6668; --line:#e3dfdf;
  --red:#d3241c; --red-soft:#fbe7e5; --grey-step:#b9b3b4; --ok:#1f7a4a; --ok-soft:#e3f2ea; --warn:#a15c00;
  --amber:#e0a100; --amber-soft:#fdf3d6; --amber-ink:#7a5600;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121011; --surface:#1c191a; --ink:#f3f0f0; --muted:#a29b9d; --line:#2f2a2c;
  --red:#ef4a40; --red-soft:#3a1715; --grey-step:#5b5456; --ok:#4cc286; --ok-soft:#14301f; --warn:#e7a14a;
  --amber:#f2c14e; --amber-soft:#3a2f12; --amber-ink:#f2c14e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121011; --surface:#1c191a; --ink:#f3f0f0; --muted:#a29b9d; --line:#2f2a2c;
  --red:#ef4a40; --red-soft:#3a1715; --grey-step:#5b5456; --ok:#4cc286; --ok-soft:#14301f; --warn:#e7a14a;
  --amber:#f2c14e; --amber-soft:#3a2f12; --amber-ink:#f2c14e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase;line-height:1;display:block}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.role{font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.role.trainer{border-color:var(--red);color:var(--red)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:34px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:18px;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
section.view{padding-top:22px}
.muted{color:var(--muted)}
button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.client:focus-visible,.brand:focus-visible,.daychip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.notice{padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px dashed var(--line);color:var(--muted)}
.notice.err{border-style:solid;border-color:var(--red);color:var(--ink);background:var(--red-soft)}
/* picker */
.clients{display:grid;gap:10px}
.client{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--surface);
  border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.client:hover{border-color:var(--red)}
.mono{font-family:var(--display);font-weight:800;font-size:22px;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.client .meta{min-width:0}
.client .meta b{font-family:var(--display);font-size:22px;font-weight:700;text-transform:uppercase;display:block;line-height:1.1}
.client .meta span{font-size:13px;color:var(--muted)}
.arrow{color:var(--red);font-weight:700;font-size:20px}
/* client header */
.chead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.daynote{font-size:13px;padding:8px 12px;border-left:3px solid var(--red);background:var(--surface);border-radius:0 8px 8px 0}
.howto{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 14px;font-size:13px}
.howto details{flex:1 1 100%}
.howto summary{cursor:pointer;color:var(--muted);font-weight:600}
.howto p{margin:6px 0 0;line-height:1.45}
.vid{color:var(--red);font-weight:600;text-decoration:none}
.vid:hover{text-decoration:underline}
.load label small{display:block;font-size:9px;letter-spacing:0;text-transform:none}
.fact.start{border-color:var(--red);color:var(--red)}
.fact{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tab{min-height:40px;border:0;border-radius:8px;background:none;cursor:pointer;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.daychip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;min-height:44px}
.daychip small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.daychip b{font-family:var(--display);font-size:17px;font-weight:700;text-transform:uppercase}
.daychip[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.daychip[aria-pressed="true"] small{color:var(--red)}
.block{display:flex;flex-direction:column;gap:8px}
.blocktitle{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);margin-top:6px}
.blocktitle::after{content:"";flex:1;height:1px;background:var(--line)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ex.light{background:transparent;border-style:dashed;padding:10px 14px}
.ex{scroll-margin-top:calc(80px + env(safe-area-inset-top,0px))}
.ex.done{background:var(--ok-soft);border-color:var(--ok);padding:10px 14px}
.ex.done .name{color:var(--ok)}
.rep1{height:40px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--red);font-size:18px;font-weight:700;cursor:pointer}
.rep1:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exhead .name{font-weight:600;min-width:0}
.exhead .note{font-size:12px;color:var(--muted)}
.sr{font-family:var(--display);font-weight:800;font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sr span{color:var(--red)}
.params{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.params b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.loads{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.load{display:flex;flex-direction:column;gap:2px}
.load label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.load input{width:100%;min-width:0;height:40px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);text-align:center;
  font:600 14px var(--body);font-variant-numeric:tabular-nums;padding:0;letter-spacing:-.02em}
.load input:not(:placeholder-shown){border-color:var(--ink)}
/* entreno del día: día entrenado + series de la sesión */
.entreno{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.entreno.on{border-color:var(--ok);background:var(--ok-soft)}
.entreno .ef{display:flex;flex-direction:column;gap:2px;flex:1 1 150px;min-width:0}
.entreno .ef label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.entreno .ef input{min-height:40px;max-width:180px}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.series{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.series .sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.series .prev{font-size:12px;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:400;text-align:right;font-variant-numeric:tabular-nums}
.wkhead{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:1px dashed var(--line);padding-top:8px}
.wk{height:44px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 14px var(--body);font-variant-numeric:tabular-nums;line-height:1.1}
.wk.on{border-color:var(--ink);color:var(--ink)}
.wk small{font-size:10px;font-weight:500;color:var(--muted)}
.srow{display:grid;grid-template-columns:62px minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;align-items:center}
.srow span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.srow input{width:100%;min-width:0;height:40px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);text-align:center;font:600 14px var(--body);font-variant-numeric:tabular-nums;padding:0}
.srow input:not(:placeholder-shown){border-color:var(--ink)}
.shead{display:grid;grid-template-columns:62px minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.serbtns{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.okbtn{min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--ok);background:transparent;color:var(--ok);font:600 13px var(--body);cursor:pointer}
.okbtn.on{border-color:var(--line);color:var(--muted)}
.okbtn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.addset{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--red);font-weight:600;cursor:pointer;font-size:13px}
.addset:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.sesrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.sesrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sesrow .ln{font-size:13px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.sesrow .ln span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.save{font-size:12px;color:var(--muted);min-height:18px}
.bienv{display:flex;flex-direction:column;gap:8px;padding:18px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--red)}
.bienv h2{margin:0;font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1.05}
.bienv p{margin:0;color:var(--muted)}
.meal.plan header .mh{font-size:12px;opacity:.85}
.meal.plan .slot{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start;padding:10px 14px;border-top:1px solid var(--line);cursor:default}
.meal.plan label.slot{cursor:pointer}
.meal.plan .slot .sk{grid-column:1/-1;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--red)}
.meal.plan .slot .sk:empty{display:none}
.meal.plan .slot input[type=checkbox],.meal.plan .slot .vchk{grid-column:1;margin:3px 0 0}
.meal.plan .slot .sv{grid-column:2;display:flex;flex-direction:column;gap:2px;min-width:0}
.meal.plan .slot:not(:has(input)):not(:has(.vchk)) .sv{grid-column:1/-1}
.meal.plan .slot.on .sv>.fn,.meal.plan .slot.on .sv>.qline{opacity:.55;text-decoration:line-through}
.meal.plan .slot .smac{grid-column:2;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.meal.plan .slot .so{font-size:12px;color:var(--muted)}
.meal.plan .opts{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-top:5px;font-size:13px;color:var(--muted)}
.meal.plan .opt{font:inherit;font-size:13px;padding:0;border:0;background:none;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-align:left}
.meal.plan .opt::before{content:"o ";color:var(--muted);text-decoration:none;display:inline-block;white-space:pre}
.meal.plan .opt[disabled]{cursor:default;text-decoration:none}
.meal.plan .opt.volver{color:var(--red);text-decoration:none;margin-top:4px}
.meal.plan .slot.inf .sv b{font-weight:600}
.phead{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:14px;background:var(--grad,var(--red));color:#fff}
.phead .pk{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.85}
.phead h2{margin:0;font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase;line-height:1}
.phead .pf{font-size:12px;opacity:.85}
.pinfo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.pinfo .pk{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--red)}
.pinfo h3{margin:0;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1.1}
.pinfo ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.pinfo p{margin:0;font-size:14px;white-space:pre-line}
.pinfo.ind{border-left:3px solid var(--red)}
.pinfo.plato .pfig{width:min(62vw,220px);align-self:center}
.pinfo.plato .pfig svg{width:100%;height:auto;display:block}
.pinfo .pleg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pinfo .pleg div{display:flex;flex-direction:column;gap:2px;font-size:13px}
.pinfo .pleg span{color:var(--muted);font-size:12px}
.in-ver{margin:14px 0 0;font-size:11px;letter-spacing:.08em;color:var(--muted);opacity:.7;text-align:center}
.opcent{display:flex;flex-direction:column;gap:8px;margin-top:8px;padding-top:14px;border-top:1px solid var(--line)}
.opsons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opson{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.opson b{font-size:14px}.opson span{font-size:12px;color:var(--muted);line-height:1.3}
.opson.on{border-color:var(--red);background:var(--red-soft)}
.agdia{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.agdh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-transform:capitalize}
.agdh .muted{font-size:12px;text-transform:none}
.agturno{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.agturno:has(> .agn:first-child){grid-template-columns:minmax(0,1fr) auto}
.agturno .agh{font-family:var(--display);font-weight:800;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.agturno .agn{font-weight:600}.agturno .agn small{font-weight:400;color:var(--muted)}
.agturno.aus .agh,.agturno.aus .agn{opacity:.45;text-decoration:line-through}
.agvacio{font-size:13px;color:var(--muted)}
.agmas{align-self:flex-start;font-size:13px}
.agform{display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px dashed var(--line)}
.agform select,.agform input{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink)}
.agtimes{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.agchips{display:flex;gap:6px;flex-wrap:wrap}
.agchip{min-width:40px;min-height:40px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.agchip[aria-pressed="true"],.agchip.on{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.daynote .notak{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:4px}
.prevciclo{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prevciclo .pck{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.prog.anterior{opacity:.8;border-style:dashed!important;margin-top:-4px}
.prog.anterior .name{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.save.ok{color:var(--ok)}
/* progreso */
.prog{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.prog .name{font-weight:600;min-width:0}
.prog .delta{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;text-align:right}
.delta.up{color:var(--ok)} .delta.flat{color:var(--muted)}
.prog svg{grid-column:1/-1;width:100%;height:56px;display:block}
.prog .sub{grid-column:1/-1;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* dieta */
.macros{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:560px){.macros{grid-template-columns:repeat(4,minmax(0,1fr))}}
.macro{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.macro .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.macro .v{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.macro .v small{font-size:14px;color:var(--muted);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.over{background:var(--warn)}
.macro .st{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

<script>
(() => {
const app = document.getElementById("app");
const S = { db:null, user:null, uid:null, owner:false, clientes:{}, cargas:{}, pagos:{}, admisiones:[], loaded:false, nombres:{}, solicitudes:[], rawCargas:{}, rawReg:{}, ses:{}, rawSes:{}, rawRegSes:{}, fecha:null, extra:{},
  view:"picker", cid:null, tab:"rutina", day:0, error:null };
window.__app = S;
try { const v = JSON.parse(localStorage.getItem("rc-sel")||"null"); if (v && v.cid){ S.cid=v.cid; S.tab=v.tab||"rutina"; S.day=v.day||0; if (v.fecha!==isoDate(new Date())) S.diaAuto=true; } } catch(e){}
S.view="inicio";
function remember(){ try{ localStorage.setItem("rc-sel", JSON.stringify(S.view==="cliente"?{cid:S.cid,tab:S.tab,day:S.day,fecha:isoDate(new Date())}:{})); }catch(e){} }

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v==null || v===false) continue;
    if (k==="class") el.className=v; else if (k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if (k==="text") el.textContent=v; else el.setAttribute(k, v===true?"":v);
  }
  for (const k of kids.flat()) if (k!=null && k!==false) el.append(k.nodeType?k:document.createTextNode(String(k)));
  return el;
}
const fmt = n => (Math.round(n*10)/10).toString().replace(".",",");
const num = v => { const x=parseFloat(String(v).replace(",",".")); return isFinite(x)?x:null; };
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
const exKey = (di, name) => "d"+di+"-"+slug(name);

const keyOf = (di, e) => e.id || exKey(di, e.nombre);
const safeUrl = u => /^https:\/\//i.test(String(u||"").trim()) ? String(u).trim() : "";
function parseFecha(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||"")); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function fechaCorta(iso){ const d=parseFecha(iso); return d?d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear():""; }
function inicioTxt(iso){
  const d=parseFecha(iso); if(!d) return "";
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const dias=Math.floor((hoy-d)/86400000);
  if (dias<0) return "Empieza el "+fechaCorta(iso);
  return "Desde el "+fechaCorta(iso)+" · semana "+(Math.floor(dias/7)+1);
}
function edadDesde(iso){
  const d=parseFecha(iso); if(!d) return null;
  const hoy=new Date(); let e=hoy.getFullYear()-d.getFullYear();
  if (hoy.getMonth()<d.getMonth() || (hoy.getMonth()===d.getMonth() && hoy.getDate()<d.getDate())) e--;
  return e;
}
function diasAlCumple(iso){
  const d=parseFecha(iso); if(!d) return null;
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  let p=new Date(hoy.getFullYear(), d.getMonth(), d.getDate());
  if (p<hoy) p=new Date(hoy.getFullYear()+1, d.getMonth(), d.getDate());
  return Math.round((p-hoy)/86400000);
}
function cumpleTxt(iso){
  const d=parseFecha(iso); if(!d) return "";
  const n=diasAlCumple(iso), dm=d.getDate()+"/"+(d.getMonth()+1);
  return n===0 ? "🎂 ¡Hoy cumple! ("+dm+")" : n===1 ? "🎂 Mañana cumple ("+dm+")" : "🎂 "+dm+" · en "+n+" días";
}
/* ---------- estado y pagos ---------- */
const COBROS_DESDE = "2026-10";           // primer mes que se controla
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const isoDate = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const hoyIso = () => isoDate(new Date());
const enPausa = c => (c && c.estado) === "pausa";
const sinPagos = c => !!(c && (c.sinPagos || c.soloEntrenador));
function pausado(p, iso){ return ((p&&p.pausas)||[]).some(x => x.desde && x.desde <= iso && (!x.hasta || iso < x.hasta)); }
/* los cobros van por la fecha de alta del alumno, no por el inicio del ciclo de entrenamiento */
const fAlta = c => (c && (c.fechaAlta || c.fechaInicio)) || "";
function vencimiento(c, ym){
  const d0=parseFecha(fAlta(c)); if(!d0) return null;
  const [y,m]=ym.split("-").map(Number), last=new Date(y,m,0).getDate();
  return new Date(y,m-1,Math.min(d0.getDate(),last));
}
function cuotas(cid){
  const c=S.clientes[cid], p=S.pagos[cid]||{}; if(!c || sinPagos(c) || !parseFecha(fAlta(c))) return [];
  const ini=fAlta(c).slice(0,7), desde = ini>COBROS_DESDE ? ini : COBROS_DESDE;
  const t=new Date(), hasta=isoDate(new Date(t.getFullYear(), t.getMonth()+1, 1)).slice(0,7);
  const out=[]; let [y,m]=desde.split("-").map(Number);

/* resumen al terminar el entreno: marca el día como entrenado y calcula series, kilos y récords */

  const q0=cola[0]; if(!q0) return null;
  const puede=!!(S.owner||S.uid); if (puede) queueSes(q0.sk, q0.di, x=>{ x.hecho=true; }, h("div"));
  const ses=getSes(q0.sk)||{}; let series=0, vol=0, ej=0; const recs=[];
  for (const q of cola){ if(!q.registro) continue;
    const a=((ses.ej||{})[q.key])||[], ok=((ses.ok||{})[q.key]);
    const hechas=a.filter(st=>st&&st.kg&&st.r); if (hechas.length||ok) ej++;
    series += ok&&!hechas.length ? q.series : hechas.length;
    for (const st of hechas) vol += (num(st.kg)||0)*(num(st.r)||0);
    const cur=Math.max(0,...hechas.map(st=>num(st.kg)||0)), best=mejorPrevio(q.key, q.fecha);
    if (best>0 && cur>best) recs.push({nombre:q.nombre, kg:cur, antes:best});
  }
  if (!S.festejado[q0.sk]){ S.festejado[q0.sk]=true; setTimeout(fiesta, 200); }
  const c=S.clientes[S.cid]||{}, dia=(c.dias||[])[q0.di??S.day]||{};
  return {series, vol:Math.round(vol), ej, recs, wa:MARCA.waLink, frase:MARCA.lema, dia:dia.foco||dia.nombre||"", alumno:S.owner?"":(c.nombre||"")};
};
window.__dzAnotar = (q, i, campo, val, status) => {
  queueSes(q.sk, q.di, x=>{ x.ej=x.ej||{}; const a=(x.ej[q.key]||[]).slice(); while(a.length<=i) a.push({kg:"",r:""});
    a[i]=Object.assign({kg:"",r:""},a[i],{[campo]:val});
    while(a.length && !a[a.length-1].kg && !a[a.length-1].r) a.pop(); if (a.length) x.ej[q.key]=a; else delete x.ej[q.key];
    if (val) x.hecho=true; }, status);
};
window.__rerender = () => { if (S.view==="cliente") rerender(); };
/* ejercicio completado sin cargar peso (peso corporal, isométricos, o si no quiere anotar) */
const okEx=(sk,key)=>!!(((getSes(sk)||{}).ok||{})[key]);
function exCompleto(e,key,sk){
  if (okEx(sk,key)) return true;
  const a=(((getSes(sk)||{}).ej)||{})[key]||[], base=Math.max(1,Math.min(10,parseInt(e.series,10)||3));
  return a.filter(st=>st&&st.kg&&st.r).length>=base;
}

/* ---------- acceso por alumno ----------
   Cada alumno invitado ve solo su plan: el entrenador lo vincula y la app copia el plan a planes/<id del alumno>,
   que solo ese alumno (y el entrenador) puede leer. Las cargas del alumno van a registros/<id>. */
function cargaPath(cid){ if (!S.owner) return "registros/"+S.uid; const c=S.clientes[cid]; return c&&c.uid ? "registros/"+c.uid : "cargas/"+cid; }
function planDoc(c,cid){ const p=clone(c); p._cid=cid; return p; }
function applyCargas(){
  const out={};
  for (const [cid,v] of Object.entries(S.rawCargas||{})) out[cid]=Object.assign({},v);
  for (const [cid,c] of Object.entries(S.clientes)) if (c.uid && (S.rawReg||{})[c.uid]) out[cid]=Object.assign({},S.rawReg[c.uid]);
  for (const k of Object.keys(out)) if (k!==pending) S.cargas[k]=out[k];
  const os={};
  for (const [cid,v] of Object.entries(S.rawSes||{})) os[cid]=v;
  for (const [cid,c] of Object.entries(S.clientes)) if (c.uid && (S.rawRegSes||{})[c.uid]) os[cid]=S.rawRegSes[c.uid];
  for (const k of Object.keys(os)) if (k!==pending) S.ses[k]=os[k];
}
async function resolverNombres(ids){
  const falta=ids.filter(id=>!(id in S.nombres)); if(!falta.length || !S.user || !S.user.profiles) return;

}

/* ---------- guardado de cargas ---------- */
let pending=null, timer=null, writing=false;
function queueSave(key,i,val,status){
  const cur = S.cargas[S.cid] = Object.assign({}, S.cargas[S.cid]||{});
  const arr = getVals(key).slice(); arr[i]=val; cur[key]=arr;
  pending = S.cid; status.textContent="Guardando…"; status.className="save";
  clearTimeout(timer); timer=setTimeout(()=>flush(status),700);
}
/* sesiones: una por fecha y día de rutina → {fecha, dia, hecho, ej:{<ejercicio>:[{kg,r}]}} */
const sesKey = (fecha, di) => fecha+"_d"+di;
function getSes(k){ return ((S.ses[S.cid]||{})[k]) || null; }
function queueSes(k, di, mut, status){
  const all = S.ses[S.cid] = Object.assign({}, S.ses[S.cid]||{});
  const cur = all[k] ? JSON.parse(JSON.stringify(all[k])) : {fecha:k.split("_d")[0], dia:di, hecho:false, ej:{}};
  mut(cur);
  if (cur.ok && !Object.keys(cur.ok).length) delete cur.ok;
  const vacio = !cur.hecho && !cur.ok && !Object.values(cur.ej||{}).some(a=>(a||[]).some(x=>x&&(x.kg||x.r)));
  if (vacio) delete all[k]; else all[k]=cur;
  pending = S.cid; status.textContent="Guardando…"; status.className="save";
  clearTimeout(timer); timer=setTimeout(()=>flush(status),700);
}
function prevSes(di, key, antesDe){
  /* la última vez que hizo ese ejercicio: primero en el mismo día de la rutina; si no (cambió de día en un ciclo nuevo), en cualquiera */
  const all=S.ses[S.cid]||{}; let best=null, otro=null;
  for (const v of Object.values(all)) if (v && v.fecha<antesDe && (v.ej||{})[key] && v.ej[key].some(x=>x&&(x.kg||x.r))){
    if (v.dia===di){ if (!best || v.fecha>best.fecha) best=v; }
    else if (!otro || v.fecha>otro.fecha) otro=v;
  }
  return best || otro;
}
const setTxt = a => (a||[]).filter(x=>x&&(x.kg||x.r)).map(x=>(x.kg||"–")+" kg × "+(x.r||"–")).join(" · ");
async function flush(status){
  if (!pending) return; if (writing){ timer=setTimeout(()=>flush(status),400); return; }
  const cid = pending; pending=null; writing=true;
  try{
    if (!S.db) throw {code:"none"};
    await S.db.doc(cargaPath(cid)).set({valores:S.cargas[cid]||{}, sesiones:S.ses[cid]||{}, actualizado:new Date().toISOString()});
    status.textContent="Guardado"; status.className="save ok";
  }catch(e){
    status.textContent = e && e.code==="invalid_argument" ? "No tenés permiso para guardar. Avisale a Ramiro." : "No se pudo guardar. Revisá la conexión y volvé a escribir el valor.";
    status.className="save";
  }finally{ writing=false; }
}

/* cumplimiento semanal: días entrenados contra los planificados y % de la dieta marcada, por semana de lunes a domingo */
function cumplimientoNode(c){
  const plan=Math.max(1,diasEntreno(c));
  const chk=c.uid ? ((S.rawChecks||{})[c.uid]||{}).dias||{} : null;
  const ses=Object.values(S.ses[S.cid]||{}).filter(Boolean);
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const lun=new Date(hoy); lun.setDate(hoy.getDate()-((hoy.getDay()+6)%7));
  const filas=[]; let hayAlgo=false;
  for (let w=0; w<4; w++){
    const ini=new Date(lun); ini.setDate(lun.getDate()-7*w); const fin=new Date(ini); fin.setDate(ini.getDate()+6);
    const a=isoDate(ini), z=isoDate(fin);
    const ent=new Set(ses.filter(x=>x.fecha>=a&&x.fecha<=z&&(x.hecho||Object.values(x.ej||{}).some(l=>(l||[]).some(st=>st&&(st.kg||st.r))))).map(x=>x.fecha)).size;
    let dSum=0,dN=0; if (chk) for (const [iso,r] of Object.entries(chk)) if (iso>=a&&iso<=z&&r&&r.tot){ dSum+=r.n/r.tot*100; dN++; }
    if (ent||dN) hayAlgo=true;
    const pE=Math.min(100,Math.round(ent/plan*100)), pD=dN?Math.round(dSum/dN):null;
    const tono=v=>v==null?"":v>=80?"ok":v>=50?"mid":"low";
    filas.push(h("div",{class:"cumrow"},
      h("span",{class:"cumw",text:(w===0?"Esta semana":w===1?"Semana pasada":"Del "+fechaCorta(a))}),
      h("span",{class:"cumv "+tono(pE)}, h("b",{text:ent+" de "+plan}), h("small",{text:"entrenos"})),
      h("span",{class:"cumv "+tono(pD)}, h("b",{text:pD==null?"–":pD+"%"}), h("small",{text:chk?(dN?"dieta · "+dN+" días":"dieta sin marcar"):"dieta"}))));
  }
  const box=h("div",{class:"block"}, h("div",{class:"blocktitle",text:"Cumplimiento semanal"}), h("div",{class:"cumbox"}, filas));
  if (!c.uid) box.append(h("p",{class:"muted",style:"margin:0;font-size:12px",text:"La dieta se mide cuando el alumno marca su checklist desde su propia cuenta. Vinculalo en la app para verla."}));
  else if (!hayAlgo) box.append(h("p",{class:"muted",style:"margin:0;font-size:12px",text:"Todavía no anotó entrenos ni marcó la dieta en estas semanas."}));
  return box;
}

function progCard(name, vals, pts){
  const first=pts[0], last=pts[pts.length-1], diff=last.v-first.v;
  const W=300,H=56,px=10,py=8, min=Math.min(...pts.map(p=>p.v)), max=Math.max(...pts.map(p=>p.v));
  const span = max-min || 1;
  const nn=Math.max(2,vals.length), x=i=>px+i*(W-2*px)/(nn-1), y=v=>max===min?H/2:py+(H-2*py)*(1-(v-min)/span);
  const NS="http://www.w3.org/2000/svg", svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("preserveAspectRatio","none"); svg.setAttribute("aria-hidden","true");
  for (let i=0;i<nn;i++){ const l=document.createElementNS(NS,"line"); l.setAttribute("x1",x(i)); l.setAttribute("x2",x(i)); l.setAttribute("y1",4); l.setAttribute("y2",H-4);
    l.setAttribute("stroke","var(--line)"); l.setAttribute("stroke-width","1"); l.setAttribute("vector-effect","non-scaling-stroke"); svg.append(l); }
  if (pts.length>1){ const p=document.createElementNS(NS,"polyline"); p.setAttribute("points",pts.map(q=>x(q.i)+","+y(q.v)).join(" "));
    p.setAttribute("fill","none"); p.setAttribute("stroke","var(--red)"); p.setAttribute("stroke-width","2.5"); p.setAttribute("vector-effect","non-scaling-stroke"); svg.append(p); }
  pts.forEach((q,k)=>{ const c=document.createElementNS(NS,"circle"); c.setAttribute("cx",x(q.i)); c.setAttribute("cy",y(q.v)); c.setAttribute("r",k===pts.length-1?4:2.5);
    c.setAttribute("fill",k===pts.length-1?"var(--red)":"var(--ink)"); svg.append(c); });
  const cls = diff>0?"up":"flat";
  return h("div",{class:"prog"},
    h("div",{class:"name",text:name}),
    h("div",{class:"delta "+cls,text:(diff>0?"+":"")+fmt(diff)+" kg"}),
    svg,
    h("div",{class:"sub",text: vals.map((v,i)=>"S"+(i+1)+" "+(v==null?"–":fmt(v))).join(" · ")}));
}

const swNorm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();

  if (gr==="lacteos") SW[n].u.un="ml";
  SW_IDX[swNorm(n)] = n; for (const a of alias) SW_IDX[swNorm(a)] = n;
}
const swDe = it => it && it.u && it.u.gr ? (SW[it.alimento] ? it.alimento : SW_IDX[swNorm(it.alimento)]) : null;
const SW_UMBRAL = {p:5, g:3, c:6};
const SW_MAC = {p:"proteínas", g:"grasas", c:"carbohidratos"};

function swMac(it){ const q=num(it.cantidad)||0, u=it.u; it.p=Math.round(u.p*q*10)/10; it.g=Math.round(u.g*q*10)/10; it.c=Math.round(u.c*q*10)/10; it.kcal=Math.round(4*it.p+9*it.g+4*it.c); return it; }

/* aplica un cambio sobre la dieta (se modifica en el lugar); devuelve los ajustes hechos */
function swAplicar(dieta, k, nuevo){
  const [mi,ii]=k.slice(1).split("i").map(Number), meal=(dieta.comidas||[])[mi], it=meal&&meal.items[ii];
  const de=swDe(it), f=SW[nuevo]; if (!de || !f || SW[de].grupo!==f.grupo || it._sw) return null;
  const M=SW_GRUPOS[f.grupo].k, antes={p:it.p,g:it.g,c:it.c};
  const q=swRedondear((it[M]||0)/f.u[M], f.u, swPasoG(nuevo), swPasoG(nuevo));
  const nu=swMac({alimento:nuevo, cantidad:q, u:Object.assign({},f.u), _sw:{deTxt:it.alimento, deQ:foodTxt(it)}});
  meal.items[ii]=nu;
  const ajustes=[];
  for (const X of ["p","g","c"]){
    if (X===M) continue;
    let delta=(nu[X]||0)-(antes[X]||0); if (Math.abs(delta)<SW_UMBRAL[X]) continue;
    const cand=[];
    (dieta.comidas||[]).forEach((m,mj)=>(m.items||[]).forEach((x,ij)=>{
      if (mj===mi && ij===ii) return; if (x._sw || x._fuera) return;
      const n2=swDe(x); if (!n2 || SW_GRUPOS[SW[n2].grupo].k!==X || !x.u[X]) return;
      cand.push({x, mismo:mj===mi, mj, ij, n2});
    }));
    cand.sort((a,b)=>(b.mismo-a.mismo) || ((b.x[X]||0)-(a.x[X]||0)));
    for (const cd of cand){
      if (Math.abs(delta)<SW_UMBRAL[X]) break;
      const x=cd.x, q0=num(x.cantidad)||0, qa=Math.max(0, swRedondear(q0 - delta/x.u[X], x.u, swPasoG(cd.n2), 0));
      if (qa===q0) continue;
      const nuevoX=Math.round(x.u[X]*qa*10)/10, resto=delta-((x[X]||0)-nuevoX);
      if (Math.abs(resto)>=Math.abs(delta)) continue;          // solo si acerca al objetivo
      if (!x._aj) x._aj={q:q0, txt:foodTxt(x)};
      x.cantidad=qa; swMac(x); if (qa===0) x._fuera=true;
      delta=resto;
      ajustes.push({k:"m"+cd.mj+"i"+cd.ij, alimento:x.alimento, de:x._aj.txt, a:qa===0?null:foodTxt(x)});
    }

}

/* dieta del día = plan + cambios guardados, recalculada desde cero cada vez */
function dietaDelDia(d, lista){
  const out=clone(d||{}); out.comidas=out.comidas||[];
  for (const m of out.comidas) for (const it of m.items||[]) if (it.u && it.u.gr && swDe(it)) swMac(it);
  for (const ch of lista||[]){
    const [mi,ii]=ch.k.slice(1).split("i").map(Number), it=((out.comidas[mi]||{}).items||[])[ii];
    if (!it || swNorm(it.alimento)!==swNorm(ch.de)) continue;   // el plan cambió: el cambio viejo ya no aplica
    swAplicar(out, ch.k, ch.a);

}
function swOpciones(dieta, k, noCome, lista){
  const [mi,ii]=k.slice(1).split("i").map(Number), it=dieta.comidas[mi].items[ii], de=swDe(it); if(!de) return [];
  const base=totDia(dieta), out=[];

    const t=totDia(prueba), dif={}; for (const x of ["kcal","p","g","c"]) dif[x]=Math.round(t[x]-base[x]);
    out.push({n, item:prueba.comidas[mi].items[ii], aj, dif});

  return out.sort((a,b)=>Math.abs(a.dif.kcal)-Math.abs(b.dif.kcal));

/* una encuesta ya es de un alumno si quedó vinculada a su ficha, o si la mandó desde su propia cuenta y esa cuenta está vinculada */
function admCid(a){ if (a.cid && S.clientes[a.cid]) return a.cid; const e=Object.entries(S.clientes).find(([,c])=>c.uid && c.uid===a.id); return e?e[0]:null; }
/* respuestas de Google Forms (llegan a "admisiones" con origen "google" y respuestas = [[pregunta, valor], …]) */
const fRes = (a,re) => { const x=(a.respuestas||[]).find(([q])=>re.test(q)); return x?String(x[1]||"").trim():""; };
const fIso = t => { const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(t||"")); return m? m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0") : ""; };
function nuevoDesdeEncuesta(a){
  const nombre=fRes(a,/^nombre/i).replace(/\s+/g," ").replace(/(^|\s)\S/g,x=>x.toUpperCase())||"Alumno nuevo";
  const d=blankCliente(nombre);
  d.datos={sexo:fRes(a,/^sexo/i), edad:num(fRes(a,/^edad/i))??"", peso:num(fRes(a,/^peso/i))??"", altura:num(fRes(a,/^altura/i))??"", fa:fRes(a,/actividad diaria/i)};
  d.objetivo=fRes(a,/^objetivo/i);
  d.horario=[fRes(a,/^días que/i), fRes(a,/^horarios/i)].filter(Boolean).join(" · ");
  const ini=fIso(fRes(a,/fecha en la que/i)); if (ini) d.fechaInicio=ini;
  const nac=fIso(fRes(a,/nacimiento/i)); if (nac) d.fechaNacimiento=nac;
  d.admision=(a.respuestas||[]).filter(([q,v])=>q&&v).map(([q,v])=>q+": "+v).join("\n");
  const id=(slug(nombre)||"alumno")+"-"+Math.random().toString(36).slice(2,6);
  Object.assign(S,{view:"cliente",cid:id,day:0,tab:"rutina",editing:true,draft:d,dirty:true,isNew:true,etab:"datos",delAsk:false,admisionPend:a.id});
  render(); window.scrollTo(0,0);
}

/* inputs enlazados al borrador */
function field(label, obj, key, o={}){
  const id = "ed-"+Math.random().toString(36).slice(2,9);
  let ctl;
  if (o.options) ctl = h("select",{id}, o.options.map(x=>h("option",{value:x,text:x||"—",selected:String(obj[key]??"")===x})));
  else if (o.area || o.grow) { ctl = h("textarea",{id,placeholder:o.ph||"",rows:1,class:o.grow?"grow":null}); ctl.value = obj[key]??"";
    if (o.grow){ const fit=()=>{ ctl.style.height="auto"; ctl.style.height=Math.max(44,ctl.scrollHeight+2)+"px"; }; ctl.addEventListener("input",fit); requestAnimationFrame(fit);
      ctl.addEventListener("keydown",ev=>{ if(ev.key==="Enter") ev.preventDefault(); }); } }
  else ctl = h("input",{id,type:o.date?"date":"text",inputmode:o.num?"decimal":null,placeholder:o.ph||"",value:obj[key]??""});
  ctl.addEventListener(o.options||o.date?"change":"input",()=>{
    const v = ctl.value; obj[key] = o.num ? (num(v) ?? (v.trim()===""?"":v)) : v;
    markDirty(); if (o.after) o.after();
  });
  return h("div",{class:"field"+(o.wide?" wide":"")}, label?h("label",{for:id,text:label}):null, ctl);
}
function iconBtn(label, title, fn, cls){ return h("button",{type:"button",class:"ibtn"+(cls?" "+cls:""),title,"aria-label":title,onclick:()=>{fn(); markDirty(); rerender();}},label); }
function move(arr,i,d){ const j=i+d; if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; }

function viewEditor(d){
  const sec = h("section",{class:"view stack editor"},
    h("div",{class:"stack",style:"gap:6px"},
      h("span",{class:"eyebrow",text:S.isNew?"Alumno nuevo":"Modo edición"}),
      h("h1",{text:d.nombre||"Sin nombre"}),
      h("p",{class:"muted",style:"margin:0",text:"Los cambios se ven en la app recién cuando tocás Guardar. Las cargas que ya anotó el alumno se mantienen."})),
    h("div",{class:"tabs",role:"tablist"}, [["datos","Datos"],["rutina","Rutina"],["dieta","Dieta"]].map(([k,l])=>
      h("button",{class:"tab",role:"tab","aria-selected":String(S.etab===k),onclick:()=>{S.etab=k;render();window.scrollTo(0,0);}},l))));
  if (S.etab==="datos") sec.append(editDatos(d));
  else if (S.etab==="rutina") sec.append(editRutina(d));
  else sec.append(editDieta(d));
  const status = h("div",{id:"ed-status",class:"save",text:S.dirty?"Cambios sin guardar":"Sin cambios"});
  sec.append(h("div",{class:"edbar"},
    h("div",{class:"edbar-in"}, status,
      h("div",{class:"edbar-btns"},
        h("button",{class:"btn",type:"button",onclick:discardEdit},S.isNew?"Cancelar":"Descartar"),
        h("button",{class:"btn primary",type:"button",onclick:saveEdit},"Guardar")))));
  return sec;
}
function discardEdit(){
  const wasNew=S.isNew; Object.assign(S,{editing:false,draft:null,dirty:false,isNew:false,delAsk:false});
  if (wasNew){ S.view="picker"; S.cid=null; }
  remember(); render(); window.scrollTo(0,0);
}
async function saveEdit(){
  const d=S.draft, st=document.getElementById("ed-status");
  if (!String(d.nombre||"").trim()){ S.etab="datos"; render(); flashBar("El alumno necesita un nombre."); return; }
  const empty=[]; (d.dias||[]).forEach(dia=>(dia.bloques||[]).forEach(b=>(b.ejercicios||[]).forEach(e=>{ if(!String(e.nombre||"").trim()) empty.push(e); })));
  if (empty.length){ S.etab="rutina"; rerender(); flashBar("Hay ejercicios sin nombre. Completalos o borralos."); return; }
  st.textContent="Guardando…"; st.className="save";
  try{
    const clean=clone(d);
    for (const m of clean.dieta?.comidas||[]){ m.items=(m.items||[]).filter(i=>i.alimento); m.items.forEach(i=>delete i._u); }
    await S.db.doc("clientes/"+S.cid).set(clean);
    if (clean.uid) await S.db.doc("planes/"+clean.uid).set(planDoc(clean,S.cid));
    if (S.admisionPend){ const aid=S.admisionPend; S.admisionPend=null; S.db.doc("admisiones/"+aid).update({cid:S.cid}).catch(()=>{}); }
    S.clientes[S.cid]=clean;
    Object.assign(S,{editing:false,draft:null,dirty:false,isNew:false,delAsk:false,tab:S.etab==="dieta"?"dieta":"rutina"});
    if (S.day>=(clean.dias||[]).length) S.day=0;
    remember(); render(); window.scrollTo(0,0);
  }catch(e){ flashBar("No se pudo guardar. Revisá la conexión y tocá Guardar de nuevo."); }
}

            h("button",{class:"btn danger",type:"button",onclick:borrarAlumno},"Sí, borrar alumno")))
      : h("button",{class:"btn danger-ghost",type:"button",onclick:()=>{S.delAsk=true;rerender();}},"Borrar alumno");
    wrap.append(h("fieldset",null,h("legend",{text:"Zona de cuidado"}),del));
  }

async function borrarAlumno(){
  const cid=S.cid;
  try{
    const uid=(S.clientes[cid]||{}).uid;
    await S.db.doc("clientes/"+cid).delete();
    try{ await S.db.doc("cargas/"+cid).delete(); }catch(e){}
    if (uid){ try{ await S.db.doc("planes/"+uid).delete(); }catch(e){} }
    delete S.clientes[cid];
    Object.assign(S,{editing:false,draft:null,dirty:false,delAsk:false,view:"picker",cid:null});
    remember(); render(); window.scrollTo(0,0);
  }catch(e){ flashBar("No se pudo borrar. Probá de nuevo."); }
}

function calcItem(it){
  const q0=num(it.cantidad)||0;
  if (!it.u && FOODS[it.alimento]) it.u=Object.assign({},FOODS[it.alimento]);
  if (it.u){ const u=it.u; it.p=Math.round(u.p*q0*10)/10; it.g=Math.round(u.g*q0*10)/10; it.c=Math.round(u.c*q0*10)/10; it.kcal=Math.round(4*it.p+9*it.g+4*it.c); delete it.medida; return; }
  const f=null; const q=q0;
  let u;
  if (f) { u={medida:f[0],p:f[1],g:f[2],c:f[3]}; }
  else if (it._u) u=it._u;
  else { const q0=num(it.cantidad)||1; u={medida:it.medida,p:(it.p||0)/q0,g:(it.g||0)/q0,c:(it.c||0)/q0}; }
  it._u=u; it.medida=u.medida;
  it.p=Math.round(u.p*q*10)/10; it.g=Math.round(u.g*q*10)/10; it.c=Math.round(u.c*q*10)/10;
  it.kcal=Math.round(4*it.p+9*it.g+4*it.c);
}

/* ---------- cobros e ingresos (solo entrenador) ----------
   Junta las cuotas de todos los alumnos por mes: lo cobrado, lo que falta y lo previsto para el mes que viene.
   Una cuota pagada usa el monto guardado al marcarla; si no tiene, el monto actual del alumno. */
const pesos = n => "$ "+Math.round(n||0).toLocaleString("es-AR");
function ymOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function mesTxt(ym){ const [y,m]=ym.split("-").map(Number); return MESES[m-1]+" "+y; }
function cobrosPorMes(){
  const out={};
  for (const [cid,c] of Object.entries(S.clientes)){
    if (sinPagos(c)) continue;
    const p=S.pagos[cid]||{}, montoAct=num(p.monto);
    for (const q of cuotas(cid)){
      const reg=(p.meses||{})[q.ym]||{}, monto = num(reg.monto) ?? montoAct;
      (out[q.ym]=out[q.ym]||[]).push({cid, nombre:c.nombre, q, monto, sinMonto: monto==null});
    }
  }
  for (const k in out) out[k].sort((a,b)=>a.q.v-b.q.v || a.nombre.localeCompare(b.nombre,"es"));
  return out;
}
function sumar(rows, est){ return rows.filter(r=>est.includes(r.q.estado)).reduce((a,r)=>a+(r.monto||0),0); }
function viewCobros(){
  const hoy=new Date(), esteMes=ymOf(hoy), proxMes=ymOf(new Date(hoy.getFullYear(),hoy.getMonth()+1,1));
  const porMes=cobrosPorMes(), meses=Object.keys(porMes).sort().reverse();
  const act=porMes[esteMes]||[], prox=porMes[proxMes]||[];
  const cobrado=sumar(act,["pago"]), vencido=sumar(act,["pendiente"]), aVencer=sumar(act,["proximo"]);
  const previsto=sumar(prox,["pago","pendiente","proximo"]);
  const sinMonto=[...new Set(Object.values(porMes).flat().filter(r=>r.sinMonto && r.q.estado!=="pausa").map(r=>r.nombre))];
  const sec=h("section",{class:"view stack"},
    h("button",{class:"linkbtn",style:"align-self:flex-start",onclick:()=>go("picker")},"← Alumnos"),
    h("span",{class:"eyebrow",text:"Panel del entrenador"}), h("h1",{text:"Cobros e ingresos"}),
    h("p",{class:"muted",style:"margin:0",text:"Cada cuota vence el mismo día de la fecha de inicio del alumno. Tocá el estado de una cuota para marcarla como paga."}));
  const tile=(k,v,sub,cls)=>h("div",{class:"macro cob"+(cls?" "+cls:"")}, h("span",{class:"k",text:k}), h("span",{class:"v cobv",text:pesos(v)}), h("span",{class:"st",text:sub}));
  sec.append(h("div",{class:"macros"},
    tile("Cobrado en "+MESES[hoy.getMonth()], cobrado, act.filter(r=>r.q.estado==="pago").length+" cuotas pagas"),
    tile("Vencido sin pagar", vencido, vencido? act.filter(r=>r.q.estado==="pendiente").map(r=>r.nombre).join(", ") : "Nadie debe", vencido?"late":""),
    tile("Falta vencer este mes", aVencer, aVencer? act.filter(r=>r.q.estado==="proximo").length+" cuotas hasta fin de mes" : "No quedan cuotas"),
    tile("Previsto "+mesTxt(proxMes), previsto, prox.filter(r=>r.q.estado!=="pausa").length+" cuotas · si todos siguen activos")));
  sec.append(h("div",{class:"daynote",text:"Total del mes de "+MESES[hoy.getMonth()]+": "+pesos(cobrado+vencido+aVencer)+" ("+pesos(cobrado)+" ya cobrados). El mes que viene te ingresan "+pesos(previsto)+"."}));
  if (sinMonto.length) sec.append(h("div",{class:"notice err",text:"Sin monto cargado: "+sinMonto.join(", ")+". Cargalo en la pestaña Pagos del alumno para que sume en los totales."}));
  const status=h("div",{class:"save"}); sec.append(status);
  for (const ym of meses){
    const rows=porMes[ym], tot=sumar(rows,["pago","pendiente","proximo"]), cob=sumar(rows,["pago"]);
    const tag = ym===esteMes ? "Este mes" : ym===proxMes ? "Mes que viene" : "Mes cerrado";
    const blk=h("div",{class:"block"},
      h("div",{class:"blocktitle",text:mesTxt(ym)+" · "+tag}),
      h("div",{class:"cobtot"}, h("span",null,"Cobrado ",h("b",{text:pesos(cob)})), h("span",null,"de ",h("b",{text:pesos(tot)})), tot>cob?h("span",{class:"pendchip",text:"Falta "+pesos(tot-cob)}):h("span",{class:"chkchip ok",text:"Completo"})));
    for (const r of rows){
      const q=r.q, vence=q.v.getDate()+"/"+(q.v.getMonth()+1);
      const sub = q.estado==="pago" ? "Vencía el "+vence+(q.fechaPago?" · pagó el "+fechaCorta(q.fechaPago):"")
        : q.estado==="pausa" ? "En pausa · no se cobra" : q.estado==="proximo" ? "Vence el "+vence : "Venció el "+vence;
      let btn;
      if (q.estado==="pausa") btn=h("button",{class:"pago na",type:"button",disabled:true},"En pausa");

      else btn=h("button",{class:"pago pend",type:"button","aria-label":r.nombre+" "+mesTxt(ym)+": tocá para marcar pago",onclick:()=>guardarPagos(r.cid,x=>{ x.meses=x.meses||{}; x.meses[q.ym]=Object.assign({}, x.meses[q.ym]&&x.meses[q.ym].especial?{especial:true,nota:x.meses[q.ym].nota}:{}, {estado:"pago",fecha:hoyIso(),monto:num((x.meses[q.ym]||{}).monto)??num(x.monto)}); return x; },status)}, q.estado==="proximo"?"Próximo":"Pendiente");
      blk.append(h("div",{class:"payrow"+(q.estado==="pendiente"?" late":"")},
        h("div",{style:"min-width:0"}, h("b",{text:r.nombre}), h("div",{class:"sub",text:sub})),
        h("div",{class:"cobright"}, h("span",{class:"cobm",text:r.sinMonto?"Sin monto":pesos(r.monto)}), btn)));
    }
    sec.append(blk);
  }
  if (!meses.length) sec.append(h("div",{class:"notice",text:"Todavía no hay cuotas. Cargá la fecha de inicio y el monto de cada alumno para verlas acá."}));
  return sec;
}

/* ---------- datos ---------- */
render();
(async()=>{
  const [db,user] = await Promise.all([claude.use("db"), claude.use("user")]);
  S.db=db; S.user=user;
  if (user){ S.owner = await user.isOwner(); S.uid = await user.id(); }
  if (!db){ S.loaded=true; S.error="No se pudo conectar con los datos. Revisá la conexión y recargá la página."; render(); return; }
  const quieto=()=>{ const ae=document.activeElement; return !S.editing && !(ae && (ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.tagName==="SELECT")); };
  if (!S.owner){
    /* alumno: solo su propio plan */
    if (!S.uid){ S.loaded=true; S.error="Ingresá con tu cuenta para ver tu plan."; render(); return; }
    let pidio=false;
    db.doc("planes/"+S.uid).onSnapshot(doc=>{
      if (doc.exists){
        const c=doc.data(), cid=c._cid||"mi-plan";
        S.clientes={[cid]:c}; S.miCid=cid;
        if (S.myReg && pending!==cid){ S.cargas[cid]=Object.assign({},S.myReg); S.ses[cid]=S.mySes||{}; }
        if (S.view!=="encuesta" && S.view!=="cliente" && S.view!=="inicio"){ S.view="cliente"; S.cid=cid; S.tab=S.tab||"rutina"; }
        if (S.view==="inicio"){ S.cid=cid; S.tab=S.tab||"rutina"; }
        if (S.view==="cliente") S.cid=cid;
      } else {
        S.clientes={}; S.miCid=null; if (S.view==="cliente") S.view="picker";
        if (!pidio){ pidio=true; db.doc("solicitudes/"+S.uid).set({fecha:new Date().toISOString()}).catch(()=>{ S.sinPermiso=true; if(quieto()) render(); }); }
      }
      S.loaded=true; if (quieto()) render();
    }, ()=>{ S.loaded=true; S.error="No se pudo cargar tu plan. Recargá la página."; render(); });
    db.doc("checks/"+S.uid).onSnapshot(doc=>{
      if (S.chkWriting) return;
      S.myChecks=(doc.exists && doc.data()) || {dias:{}};
      if (quieto()) render();
    }, ()=>{ S.myChecks={dias:{}}; });
    db.doc("registros/"+S.uid).onSnapshot(doc=>{
      S.myReg=(doc.exists && (doc.data()||{}).valores)||{};
      S.mySes=(doc.exists && (doc.data()||{}).sesiones)||{};
      if (S.miCid && pending!==S.miCid){ S.cargas[S.miCid]=Object.assign({},S.myReg); S.ses[S.miCid]=S.mySes; }
      if (quieto()) render();
    }, ()=>{});
    render(); return;
  }
  db.collection("clientes").onSnapshot(snap=>{
    const o={}; snap.docs.forEach(d=>o[d.id]=d.data()); S.clientes=o; S.loaded=true; applyCargas();
    if (S.editing) return;
    if (S.view==="cliente" && !o[S.cid]) S.view="picker";
    if (quieto()) render();
  }, ()=>{ S.loaded=true; S.error="No se pudieron cargar los alumnos. Recargá la página."; render(); });
  db.collection("cargas").onSnapshot(snap=>{
    S.rawCargas={}; S.rawSes={}; snap.docs.forEach(d=>{ const x=d.data()||{}; S.rawCargas[d.id]=x.valores||{}; S.rawSes[d.id]=x.sesiones||{}; }); applyCargas();
    if (quieto()) render();
  }, ()=>{});
  db.collection("checks").onSnapshot(snap=>{
    const o={}; snap.docs.forEach(d=>o[d.id]=d.data()); S.rawChecks=o;
    if (quieto()) render();
  }, ()=>{ S.rawChecks={}; });
  db.collection("registros").onSnapshot(snap=>{
    S.rawReg={}; S.rawRegSes={}; snap.docs.forEach(d=>{ const x=d.data()||{}; S.rawReg[d.id]=x.valores||{}; S.rawRegSes[d.id]=x.sesiones||{}; }); applyCargas();
    if (quieto()) render();
  }, ()=>{});
  db.collection("solicitudes").onSnapshot(snap=>{
    S.solicitudes=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.fecha||"").localeCompare(String(a.fecha||"")));
    if (quieto()) render();
  }, ()=>{});
  if (S.owner) db.doc("privado/agenda").onSnapshot(doc=>{ S.agenda=doc.exists?doc.data():{alumnos:{}}; if (S.view==="agenda" && quieto()) render(); }, ()=>{ S.agenda=null; });
  if (S.owner) db.collection("pagos").onSnapshot(snap=>{
    const o={}; snap.docs.forEach(d=>o[d.id]=d.data()); S.pagos=o;
    const ae=document.activeElement; if (!S.editing && !(ae && ae.tagName==="INPUT")) render();
  }, ()=>{});
  if (S.owner) db.collection("admisiones").onSnapshot(snap=>{
    S.admisiones=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.fecha||"").localeCompare(String(a.fecha||"")));
    if (S.view!=="encuesta" && !S.editing) render();
  }, ()=>{});
  render();
})();
})();
</script>

<script>
(function(){
const PRESETS=[45,60,90,120,180], C=2*Math.PI*44;
const $=id=>document.getElementById(id);
let S={total:4,done:0,rest:90,endAt:0,len:90,mode:"idle",queue:[],idx:0,log:null};
try{const s=JSON.parse(localStorage.getItem("dz-descansos")||"{}"); if(s.total) S.total=s.total; if(s.rest) S.rest=s.rest;}catch(e){}
S.len=S.rest;
const save=()=>{ if(S.queue.length) return; try{localStorage.setItem("dz-descansos",JSON.stringify({total:S.total,rest:S.rest}))}catch(e){}};
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const restTxt=s=>s<60?s+'"':fmt(s);
let ac=null;
/* tiempo de trabajo: "30\"", "30-45\"", "30 s", "20\"/lado", "5 min", "15-20 min." (rango: el número de arriba) */
function trabajoSeg(q){ if(!q) return 0; const m=String(q.reps||"").match(/(\d+)\s*(?:[-–a]\s*(\d+))?\s*("|”|''|″|s\b|seg|min)/i); if(!m) return 0;
  const v=+(m[2]||m[1])*(/^min/i.test(m[3])?60:1); return v>=5&&v<=3600?v:0; }
/* plan de trabajo de una serie: tramos con su tiempo (por lado; o sostenes de X" como "6-4-2" con "cada repetición es un sostén de 10\"") */
function planTrabajo(q, serie){
  if(!q) return null;
  const txt=String(q.reps||"")+" "+String(q.nota||""), lados=/lado/i.test(txt)?2:1;
  const sm=String(q.nota||"").match(/sost[eé]n(?:es)?\s+de\s+(\d+)\s*("|”|''|″|s\b|seg)/i), segs=[];
  if (sm){
    const hold=+sm[1], lista=String(q.reps||"").match(/\d+/g)||["1"], n=+(lista[Math.min(serie,lista.length-1)]||1);
    for(let l=1;l<=lados;l++) for(let k=1;k<=n;k++) segs.push({t:hold, lbl:"Sostén "+k+" de "+n+(lados>1?" · lado "+l:""), lado:lados>1&&k===1&&l>1});
    return {segs, total:segs.reduce((a,x)=>a+x.t,0), txt:n+" × "+hold+'"'+(lados>1?" por lado":"")};
  }
  const t=trabajoSeg(q); if(!t) return null;
  for(let l=1;l<=lados;l++) segs.push({t, lbl:lados>1?"Lado "+l:"", lado:l>1});
  return {segs, total:t*lados, txt:restTxt(t)+(lados>1?" por lado":"")};
}
const planAct=()=>planTrabajo(S.queue[S.idx], S.done);
const trabajoAct=()=>{ const p=planAct(); return p?p.total:0; };
/* tramo actual del trabajo según el tiempo que pasó */
function tramo(ahora){ const segs=S.segs||[]; let el=S.wLen-(S.wEnd-ahora)/1000, acc=0;
  for(let i=0;i<segs.length;i++){ if(el<acc+segs[i].t||i===segs.length-1) return {i, s:segs[i], left:acc+segs[i].t-el}; acc+=segs[i].t; } return null; }
/* en iPhone: que el pitido suene aunque esté en silencio y baje un momento la música en vez de cortarla */
/* modo de sonido: "musica" (por defecto) suena encima de Spotify sin cortarlo; "fuerte" usa un audio propio que suena aunque el iPhone esté en silencio, pero pausa la música */
let modoSon="musica"; try{ modoSon=localStorage.getItem("dz-sonido")||"musica"; }catch(e){}
function sesionAudio(){ try{ if(navigator.audioSession) navigator.audioSession.type = modoSon==="musica" ? "ambient" : "transient"; }catch(e){} }
sesionAudio();
/* iPhone no deja vibrar desde el navegador: el único toque posible es el de un interruptor (iOS 18 o más) */
let hapL=null;
function haptic(){ try{ if(!hapL){ hapL=document.createElement("label"); hapL.setAttribute("aria-hidden","true"); hapL.style.cssText="position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none";
  const i=document.createElement("input"); i.type="checkbox"; i.setAttribute("switch",""); i.tabIndex=-1; hapL.append(i); document.body.append(hapL); }
  hapL.click(); }catch(e){} }
/* pista de la cuenta regresiva: un audio que arranca con el toque de "Terminé la serie" y trae los pitidos ya ubicados al final.
   En iPhone un audio iniciado con un toque sigue sonando aunque la pantalla se apague y aunque el teléfono esté en silencio,
   cosa que los pitidos generados en el momento no logran */
const trk=new Audio(); trk.preload="auto"; trk.setAttribute("playsinline",""); let trkUrl=null, trkOn=false;
function eventos(seg, seg2, marcas){
  const ev=[], t=(t0,d,f)=>{ if(t0>=0) ev.push({t:t0,d,f}); }, sil=t0=>{ if(t0>=0) ev.push({t:t0,sil:1}); };
  for (const m of (marcas||[])){ if(m.lado){ t(m.t,.1,1320); t(m.t+.18,.1,1320); } else t(m.t,.12,990); }
  for(let k=3;k>=1;k--) t(seg-k, .16, k===1?1100:880);
  if (seg2){ t(seg,.55,1320); for(let k=3;k>=1;k--) if(seg2-k>1) t(seg+seg2-k,.16,k===1?1100:880); sil(seg+seg2); }
  else if (S.mode==="work") t(seg,.55,1320);
  else sil(seg);
  return ev;
}
let waNodes=[];
/* campana de largada (tipo ring de box): 3 golpes, cada uno con parciales inarmónicos que se apagan solos */
const CAMP={f:1050, golpes:[0,.42,.84], parc:[[1,1,.95],[2,.45,.6],[2.76,.35,.42],[5.4,.16,.2]], dur:1.5};
function campanaWA(st){ if(!ac) return; try{ for(const g0 of CAMP.golpes) for(const [r,amp,tau] of CAMP.parc){ const t=st+g0, o=ac.createOscillator(), g=ac.createGain();
    o.type="sine"; o.frequency.value=CAMP.f*r; g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.16*amp,t+.004); g.gain.exponentialRampToValueAtTime(.0005,t+Math.min(CAMP.dur,tau*5));
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+CAMP.dur+.05); waNodes.push(o); } }catch(e){} }
function programarWA(ev){
  audio(); if(!ac) return false; const t0=ac.currentTime+.05;
  try{ for(const e of ev){ const st=t0+e.t;
    if(e.sil){ campanaWA(st); }
    else { const o=ac.createOscillator(), g=ac.createGain(); o.type="square"; o.frequency.value=e.f;
      g.gain.setValueAtTime(.0001,st); g.gain.linearRampToValueAtTime(.18,st+.005); g.gain.exponentialRampToValueAtTime(.001,st+e.d);
      o.connect(g).connect(ac.destination); o.start(st); o.stop(st+e.d+.02); waNodes.push(o); } } }catch(e){ return false; }
  return true;
}
function pista(seg, seg2, marcas){
  const R=16000, n=Math.max(1,Math.round((seg+(seg2||0)+2.6)*R)), b=new ArrayBuffer(44+n), v=new DataView(b);
  const w=(o,t)=>{ for(let i=0;i<t.length;i++) v.setUint8(o+i,t.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+n,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,R,true); v.setUint32(28,R,true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,"data"); v.setUint32(40,n,true);
  const a=new Uint8Array(b,44); a.fill(128);
  const tono=(t0,d,f)=>{ const i0=Math.round(t0*R), i1=Math.min(n,Math.round((t0+d)*R)); if(i0<0) return;
    for(let i=i0;i<i1;i++){ const t=(i-i0)/R, env=Math.min(1,t*200,(d-t)*60); a[i]=128+Math.round(Math.sin(2*Math.PI*f*t)>=0?100*env:-100*env); } };
  /* campana de largada: 3 golpes con parciales que se apagan (se suman sobre lo que ya hay) */
  const silbato=(t0)=>{ const i0=Math.round(t0*R); if(i0<0) return; const i1=Math.min(n,Math.round((t0+CAMP.golpes[2]+CAMP.dur)*R)), buf=new Float32Array(Math.max(0,i1-i0));
    for(const g0 of CAMP.golpes) for(const [r,amp,tau] of CAMP.parc){ const j0=Math.round(g0*R);
      for(let j=j0;j<buf.length;j++){ const t=(j-j0)/R; if(t>CAMP.dur) break; buf[j]+=amp*Math.min(1,t*250)*Math.exp(-t/tau)*Math.sin(2*Math.PI*CAMP.f*r*t); } }
    for(let j=0;j<buf.length;j++) a[i0+j]=Math.max(0,Math.min(255,a[i0+j]+Math.round(52*buf[j]))); };
  for (const m of (marcas||[])){ if(m.lado){ tono(m.t,.1,1320); tono(m.t+.18,.1,1320); } else tono(m.t,.12,990); }
  for(let k=3;k>=1;k--) tono(seg-k, .16, k===1?1100:880);
  if (seg2){ tono(seg, .55, 1320); for(let k=3;k>=1;k--) if(seg2-k>1) tono(seg+seg2-k, .16, k===1?1100:880); silbato(seg+seg2); }
  else if (S.mode==="work") tono(seg, .55, 1320);
  else silbato(seg);
  return new Blob([b],{type:"audio/wav"});
}
function pistaPlay(){
  pistaStop(); if(S.mode!=="rest"&&S.mode!=="work") return;
  const w=S.mode==="work", seg=((w?S.wEnd:S.endAt)-Date.now())/1000; if(seg<=0) return;
  const seg2 = w && S.wRest ? S.wRest : 0;
  const marcas=[]; if (w && S.segs && S.segs.length>1){ const el=S.wLen-seg; let acc=0; S.segs.forEach((x,i)=>{ if(i>0 && acc-el>0.2) marcas.push({t:acc-el, lado:x.lado}); acc+=x.t; }); }
  sesionAudio();
  if (modoSon==="musica"){ trkOn=programarWA(eventos(seg, seg2, marcas)) && !!ac && ac.state==="running"; return; }
  try{ trkUrl=URL.createObjectURL(pista(seg, seg2, marcas)); trk.src=trkUrl; const pr=trk.play(); trkOn=true; if(pr&&pr.catch) pr.catch(()=>{ trkOn=false; }); }catch(e){ trkOn=false; }
}
function pistaStop(){ trkOn=false; for(const n of waNodes){ try{ n.stop(); }catch(e){} } waNodes=[]; try{ trk.pause(); }catch(e){} if(trkUrl){ try{URL.revokeObjectURL(trkUrl)}catch(e){} trkUrl=null; } }
function audio(){ if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(ac&&ac.state!=="running"&&ac.state!=="closed"){ try{ const r=ac.resume(); r&&r.catch&&r.catch(()=>{}); }catch(e){} } }
function beep(f,d){ if(!ac) return; try{const o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=f; o.type="square"; g.gain.setValueAtTime(.18,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+d);}catch(e){} }
function silbatoWA(){ if(!ac) return; campanaWA(ac.currentTime+.02); }
function buzz(p){ try{navigator.vibrate&&navigator.vibrate(p)}catch(e){} }
let lock=null;
async function awake(){ try{ if(!lock&&navigator.wakeLock){ lock=await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>lock=null);} }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState!=="visible") return;
  const corre=(S.mode==="rest"||S.mode==="work")&&!S.paused;
  if(corre||!$("dzSheet").hidden) awake();
  if(corre){ audio(); lastBeep=null; pistaPlay(); } });
/* cualquier toque reanuda el audio (el iPhone lo frena solo) */
document.addEventListener("pointerdown",()=>{ if(ac&&ac.state!=="running") audio(); },{capture:true,passive:true});

/* marca el descanso que está corriendo (el del ejercicio recién hecho) o, si no corre, el del ejercicio actual */
function presets(){ const sel=S.mode==="rest"?S.len:S.rest; $("dzPresets").innerHTML=PRESETS.map(p=>`<button class="dzchip" data-p="${p}" aria-pressed="${p===sel}">${restTxt(p)}</button>`).join(""); }
let lastBeep=null;
/* repeticiones de la serie que toca: "8 · 4 · 2" → la que corresponde; "10-12" → "10-12 reps" */
function repsSerie(q, i){
  if(!q) return ""; const r=String(q.reps||"").trim(); if(!r) return "";

/* botón flotante movible: se arrastra con el dedo o el mouse, un toque sin mover lo abre; la posición queda guardada */
(function(){

    return [Math.min(Math.max(m,x),innerWidth-r.width-m), Math.min(Math.max(m,y),innerHeight-r.height-m)]; };

  try{ const g=JSON.parse(localStorage.getItem("dz-fab")||"null"); if(g) requestAnimationFrame(()=>poner(g.x*innerWidth,g.y*innerHeight)); }catch(e){}

  /* lo de la vez anterior va en el botón ↺: si hizo lo mismo, lo toca y se completa */
  const rp=$("dzRep"); rp.hidden=!(v.pkg||v.pr);
  rp.innerHTML="<b>↺</b><span>"+esc((v.pkg||"–")+" kg × "+(v.pr||"–"))+"</span>";
  rp.setAttribute("aria-label","Igual que la vez anterior: "+(v.pkg||"–")+" kilos por "+(v.pr||"–"));
  if (reset) $("dzLogSt").textContent="";
  rangoAviso(r.value);
}
function logPut(campo, val){ if(!S.log||!window.__dzAnotar) return; window.__dzAnotar(S.log.q, S.log.i, campo, val, $("dzLogSt")); if(campo==="r") rangoAviso(val); }
/* si anota más repeticiones que el tope del rango: cortar ahí y subir el peso la próxima (cantidad de calidad) */
function topeReps(q, i){ const partes=String(q.reps||"").split(/\s*[·,]\s*/).filter(Boolean), x=partes.length>1?partes[Math.min(i,partes.length-1)]:String(q.reps||"");
  if(/["”″]|seg|min|lado.*\d+\s*s/i.test(x)) return 0; const ns=(x.match(/\d+/g)||[]).map(Number); return ns.length?Math.max(...ns):0; }
function rangoAviso(val){ const av=$("dzLogAv"), L=S.log, r=parseInt(val,10), tope=L?topeReps(L.q,L.i):0;
  if(!L || !tope || !(r>tope)){ av.hidden=true; av.textContent=""; return; }
  av.hidden=false; av.textContent="Pasaste el rango ("+L.q.reps+"). La técnica manda: cortá en "+tope+" y la próxima subí el peso."; }
$("dzKg").addEventListener("input",e=>logPut("kg",e.target.value.trim()));
$("dzR").addEventListener("input",e=>logPut("r",e.target.value.trim()));
$("dzRep").onclick=()=>{ if(!S.log) return; const v=window.__dzSerie(S.log.q,S.log.i); if(v.pkg){ $("dzKg").value=v.pkg; logPut("kg",v.pkg);} if(v.pr){ $("dzR").value=v.pr; logPut("r",v.pr);} };
function cargar(i){ const q=S.queue[i]; S.idx=i; S.total=q.series; S.rest=q.rest; S.len=q.rest||S.len; S.done=S.fin&&S.fin[i]?q.series:0; presets(); exPaint(); }
window.dzCargar=(cola,i)=>{ S.queue=cola.slice(); S.fin={}; S.hechas={}; S.porCerrar=false;
  /* con todos los ejercicios con registro hechos, el día cuenta como completo (también la entrada en calor y el core) */
  const diaListo=cola.some(q=>q.registro) && cola.every(q=>q.hecho||!q.registro);
  cola.forEach((q,k)=>{ if(q.hecho||diaListo) S.fin[k]=true; }); S.entreno=cola.length>1; S.t0=Date.now(); S.resumen=null; S.paused=false; pistaStop(); S.log=null; logPaint(true); cargar(i); S.mode="idle"; S.justChanged=false; lastBeep=null; open(); };
/* modo entreno: arranca el día desde el reloj; los ejercicios ya completos quedan marcados */
window.dzEntreno=(cola,i)=>{ window.dzCargar(cola,i); S.entreno=true; audio(); silbatoWA(); buzz([200,100,200]); haptic();
  /* si ya están hechos todos los ejercicios con registro, el entreno está completo: se ve el resumen */
  if (cola.length && cola.every((q,k)=>S.fin[k])){ S.t0=null; terminarEntreno(); return; }
  exPaint(); render(); };
/* próximo ejercicio sin terminar (después del actual; si no hay, alguno anterior que haya quedado pendiente) */
function sigIdx(){ const n=S.queue.length; for(let k=S.idx+1;k<n;k++) if(!S.fin[k]) return k; for(let k=0;k<S.idx;k++) if(!S.fin[k]) return k; return -1; }
function terminarEntreno(){
  S.mode="finished"; pistaStop(); S.paused=false;
  if (S.entreno && window.__dzResumen){ S.resumen=window.__dzResumen(S.queue)||{}; S.resumen.min=S.t0?Math.max(1,Math.round((Date.now()-S.t0)/60000)):null; finPaint(); }
  render();
}
/* ejercicio sin descanso (movilidad, activación): "Hecho" y pasa al siguiente */
function hechoSinDescanso(){ S.fin[S.idx]=true; window.__dzMarca&&window.__dzMarca(S.queue[S.idx]); const n=sigIdx(); if(n<0){ terminarEntreno(); return; } S.prevQ=S.queue[S.idx]; cargar(n); S.mode="idle"; S.justChanged=true; logPaint(false); render(); }
/* tocar un ejercicio en el mapa: va ahí sin cortar el descanso; si ya habías hecho series, retoma donde lo dejaste */
function irA(i){ if(i<0||i>=S.queue.length) return;
  if(i===S.idx&&!S.resumen) return;
  const n=S.queue[i].series||1, h=S.hechas&&S.hechas[i];
  mover(i, S.fin[i]?n:(h!=null&&h<n?h:0), false); S.justChanged=false; render(); }
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kgTxt=v=>window.__dzFmt?window.__dzFmt(v):String(v);
function mapPaint(){
  const m=$("dzMap"); m.hidden=!S.entreno||S.queue.length<2; if(m.hidden) return;
  const nf=S.queue.filter((q,k)=>S.fin[k]).length;
  m.innerHTML=`<span class="dzmapt">${nf} de ${S.queue.length} ejercicios hechos</span>`+S.queue.map((q,k)=>`<button type="button" data-i="${k}" class="${S.fin[k]?"fin":""} ${k===S.idx&&!S.resumen?"act":""} ${q.registro?"":"lig"}" aria-label="${esc((k+1)+". "+q.nombre+(S.fin[k]?" (hecho)":""))}"></button>`).join("");
}
$("dzMap").onclick=e=>{ const b=e.target.closest("button[data-i]"); if(b) irA(+b.dataset.i); };
/* sugerencia de carga según la vez anterior y el rango de repeticiones */
function sugerencia(q, pv){
  if(!pv||!pv.sets||!pv.sets.length) return "";
  const m=String(q.reps||"").match(/(\d+)\s*[-–a]\s*(\d+)/); if(!m) return "";
  const lo=+m[1], hi=+m[2], rs=pv.sets.map(x=>x.r).filter(x=>x!=null); if(!rs.length) return "";
  if (rs.length>=q.series && rs.every(r=>r>=hi)) return "▲ Llegaste al tope de "+hi+" reps: probá subir 2,5 kg";
  if (rs.some(r=>r<lo)) return "Mantené el peso hasta hacer "+lo+" reps en todas las series";
  return "Mantené el peso y buscá llegar a "+hi+" reps";
}
/* series de aproximación con los kilos ya calculados sobre el peso de trabajo */
function aproxPaint(q){
  const box=$("dzAprox"), mm=String(q.nombre).match(/^series de aproximaci[oó]n\s*:\s*(.+)$/i);
  if(!mm){ box.hidden=true; return; }
  const obj=S.queue.find(x=>x.registro&&x.nombre.toLowerCase()===mm[1].trim().toLowerCase());
  const pcts=(String(q.nota).match(/\d+(?=\s*%)/g)||["50","70","85"]).map(Number), reps=String(q.reps).split(/[·,]/).map(x=>x.trim()).filter(Boolean);
  const ref=obj&&window.__dzPrevEx&&window.__dzPrevEx(obj);
  if(!ref||!ref.kg){ box.hidden=false; box.innerHTML=`<span>Aproximación</span><p style="margin:0">Usá el ${pcts.join("%, el ")}% de tu peso de trabajo de ${esc(mm[1])}.</p>`; return; }
  box.hidden=false;
  box.innerHTML=`<span>Aproximación · peso de trabajo ${esc(kgTxt(ref.kg))} kg</span>`+pcts.map((p,k)=>`<div><em style="font-style:normal">Serie ${k+1} · ${p}%</em><b>${esc(kgTxt(Math.round(ref.kg*p/100*2)/2))} kg${reps[k]?" × "+esc(reps[k]):""}</b></div>`).join("");
}
let pintado=null;
function exPaint(){
  const q=S.queue[S.idx]; mapPaint();
  if (q && pintado!==q){ pintado=q; try{ $("dzSheet").scrollTo({top:0,behavior:"smooth"}); }catch(e){} }
  $("dzEx").hidden=!q||!!S.resumen; if(!q) return;
  $("dzExPos").textContent=(q.bloque?q.bloque+" · ":"")+"ejercicio "+(S.idx+1)+" de "+S.queue.length;
  $("dzExName").textContent=q.nombre;
  const pq=planTrabajo(q,0);
  $("dzExInfo").textContent=[q.series+" × "+q.reps, pq?"trabajo "+pq.txt:"", q.tempo?"tempo "+q.tempo:"", q.rest?"descanso "+restTxt(q.rest):"sin descanso"].filter(Boolean).join(" · ");
  const nt=$("dzExNota"); nt.hidden=!q.nota||/aproximaci/i.test(q.nombre); nt.textContent=q.nota||"";
  $("dzHowBox").hidden=!q.como&&!q.video; $("dzHow").hidden=!q.como; $("dzHow").open=false; $("dzHowP").textContent=q.como||"";
  const v=$("dzVid"); v.hidden=!q.video; if(q.video) v.href=q.video;
  aproxPaint(q);
  const pv=q.registro&&window.__dzPrevEx&&window.__dzPrevEx(q);
  $("dzExPrev").hidden=!pv;
  if(pv){ $("dzExPrevF").textContent="Tu peso anterior · "+pv.fecha; $("dzExPrevT").textContent=pv.txt; const sg=sugerencia(q,pv); $("dzSug").hidden=!sg; $("dzSug").textContent=sg; }
}
function finPaint(){
  const r=S.resumen||{}, f=$("dzFin"); f.hidden=false;
  f.innerHTML=`<span class="fk">Entreno completo</span><h3>¡Bien hecho!</h3>
    <div class="fg4"><div><b>${r.min?r.min+"'":"–"}</b><small>Tiempo</small></div><div><b>${r.ej||0}</b><small>Ejercicios</small></div>
    <div><b>${r.series||0}</b><small>Series</small></div><div><b>${(r.vol||0).toLocaleString("es-AR")}</b><small>Kilos movidos</small></div></div>`+
    (r.recs&&r.recs.length?`<span class="fk">Récords de hoy</span><ul>${r.recs.map(x=>`<li><span>${esc(x.nombre)}</span><b>${esc(kgTxt(x.kg))} kg <small style="opacity:.75">(antes ${esc(kgTxt(x.antes))})</small></b></li>`).join("")}</ul>`
      :`<p>Hoy no hubo récords de peso. Constancia: la próxima se sube.</p>`)+
    (r.frase?`<p class="ffrase">“${esc(r.frase)}”<br><small>— Ramiro</small></p>`:"");
  if (r.wa && r.alumno){
    const t=["💪 ¡Terminé el entreno de hoy!"+(r.dia?" ("+r.dia+")":""),
      [r.min?"⏱ "+r.min+" min":"", r.ej?r.ej+" ejercicios":"", r.series?r.series+" series":"", r.vol?(r.vol).toLocaleString("es-AR")+" kg movidos":""].filter(Boolean).join(" · "),
      ...(r.recs&&r.recs.length?["🏆 Récords: "+r.recs.map(x=>x.nombre+" "+kgTxt(x.kg)+" kg (antes "+kgTxt(x.antes)+")").join(", ")]:[]),
      "— "+r.alumno].join("\n");
    const a=document.createElement("a"); a.className="fwa"; a.target="_blank"; a.rel="noopener";
    a.href=r.wa+"?text="+encodeURIComponent(t); a.textContent="Mandarle el resumen a Ramiro ↗"; f.append(a);
  }
  mapPaint();
}
/* ===== navegación sin cortar el descanso ===== */
/* cambia de ejercicio o de serie y deja el reloj como estaba (si estaba descansando, el descanso sigue) */
/* atras: volviste a una serie ya hecha → las casillas de kg y reps pasan a esa serie para corregirla o rehacerla */
function mover(i, done, atras){
  S.porCerrar=false;
  const k={mode:S.mode,endAt:S.endAt,len:S.len,paused:S.paused,pausaEn:S.pausaEn}, cambia=i!==S.idx;
  if(k.mode==="work"){ pistaStop(); k.mode="idle"; k.paused=false; }
  if(k.mode==="finished") k.mode="idle";
  if(S.resumen){ S.resumen=null; $("dzFin").hidden=true; }
  if(i!==S.idx){ S.hechas=S.hechas||{}; S.hechas[S.idx]=S.done; cargar(i); }
  S.done=Math.max(0,Math.min(S.total,done));
  S.mode=k.mode; S.paused=k.mode==="rest"?k.paused:false;
  if(k.mode==="rest"){ S.endAt=k.endAt; S.len=k.len; S.pausaEn=k.pausaEn; }
  /* contador, casillas de la serie, ejercicio y mapa siempre muestran lo mismo */
  const q=S.queue[S.idx]; let nuevoLog=false;
  if(atras){ S.log = q&&q.anota ? {q, i:Math.max(0,Math.min(S.done,(q.series||1)-1))} : null; nuevoLog=true; }
  else if(cambia && k.mode!=="rest"){ S.log=null; nuevoLog=true; } /* si el descanso sigue, queda a mano la serie recién hecha */
  presets(); exPaint(); logPaint(nuevoLog); render();
}
function navPaint(nx){
  const hayCola=S.queue.length>1, q=S.queue[S.idx];
  const se=$("dzSigEj"), bar=$("dzBar");
  se.hidden=!hayCola||S.mode==="finished"||!!S.resumen;
  bar.classList.toggle("solo",se.hidden);
  if(!se.hidden){ const ult=S.idx>=S.queue.length-1;
    se.textContent= ult ? (sigIdx()<0||(sigIdx()===S.idx) ? "Terminar entreno ✓" : "Ir al pendiente ⏭") : "Siguiente ejercicio ⏭"; }
  $("dzBack").disabled=S.done<=0&&!(hayCola&&S.idx>0);
  $("dzBack").textContent=S.done>0?"◂ Serie anterior":"◂ Ejercicio anterior";
  if(S.done<=0&&!(hayCola&&S.idx>0)) $("dzBack").textContent="◂ Atrás";
  $("dzRestart").textContent=S.mode==="work"?"↺ Reiniciar serie":S.mode==="rest"?"↺ Reiniciar":"▶ Empezar descanso";
}
$("dzBack").onclick=()=>{ audio(); awake();
  if(S.done>0){ if(S.fin&&S.fin[S.idx]) S.fin[S.idx]=false; mover(S.idx,S.done-1,true); return; }
  if(S.queue.length>1&&S.idx>0){ const p=S.idx-1, tq=S.queue[p], n=tq.series||1, h=S.hechas&&S.hechas[p];
    /* vuelve a la serie donde lo dejaste; si estaba completo, a la última serie para poder rehacerla */
    if(S.fin) S.fin[p]=false; mover(p, h!=null&&h<n ? h : Math.max(0,n-1), true); }
};
$("dzSigEj").onclick=()=>{ audio(); awake();
  const q=S.queue[S.idx]; if(!q) return;
  /* si ya hiciste alguna serie, el ejercicio queda como hecho; si no, queda pendiente para después */
  if(S.done>0&&!S.fin[S.idx]){ S.fin[S.idx]=true; window.__dzMarca&&window.__dzMarca(q); }
  let n=S.idx+1;
  if(n>=S.queue.length){ n=sigIdx(); if(n<0||n===S.idx){ if(!S.fin[S.idx]){ S.fin[S.idx]=true; window.__dzMarca&&window.__dzMarca(q); } terminarEntreno(); return; } }
  mover(n, S.fin[n]?S.queue[n].series:0); S.justChanged=S.mode==="rest"; render();
};
$("dzRestart").onclick=()=>{ audio(); awake();
  if(S.mode==="work"){ S.paused=false; empezarTrabajo(); return; }
  const len=S.rest||S.len||60;
  S.paused=false; S.len=len; S.endAt=Date.now()+len*1000; S.mode="rest"; lastBeep=null; presets(); pistaPlay(); render();
};
$("dzQBack").onclick=()=>$("dzBack").click();
$("dzQSkip").onclick=()=>$("dzSigEj").click();
$("dzQPause").onclick=()=>$("dzPause").click();
$("dzAPause").onclick=()=>$("dzPause").click();
presets(); render();
})();
</script>
